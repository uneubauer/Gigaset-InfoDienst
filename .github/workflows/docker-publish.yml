name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Oder dein Standard-Branch (z.B. master)
    tags: [ "v*.*.*" ]     # Optional: Falls du mit Releases/Tags arbeitest
    workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU für die Emulation anderer Architekturen beim Bauen einrichten
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Docker Buildx initialisieren
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login bei Docker Hub (Anpassen, falls du GitHub Packages nutzt)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: uneubauer
          password: 

      # Metadaten (Tags, Labels) automatisch generieren
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dein-dockerhub-username/dein-image-name

      # Multi-Arch Build & Push durchführen
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Hier legst du die Ziel-Architekturen fest:
          # linux/amd64 = normale PCs/Server, linux/arm64 = Raspberry Pi (64-bit)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
